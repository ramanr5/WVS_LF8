<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Das vergessene Königreich – Bildschirmablauf</title>
<style>
  :root {
    --bg: #F4F2EE; --panel: #FFFFFF; --ink: #1D1D1F; --muted: #6A6A6E; --line: #E1DDD5;
    --accent: #2F6FEB; --term: #0C0C0C; --term-ink: #D6D6D6; --in: #F9F1A5; --ok: #6EE7A0;
    --mono: Consolas, "Cascadia Mono", "Cascadia Code", "SF Mono", Menlo, "DejaVu Sans Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }

  header { display: flex; align-items: center; gap: 18px; padding: 14px 22px; background: var(--panel);
    border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: clamp(17px, 1.6vw, 24px); font-weight: 700; letter-spacing: .1px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: clamp(12px, 1vw, 15px); }
  .spacer { flex: 1; }
  .btn { font: inherit; font-size: 14px; border: 1px solid var(--line); background: #FAF9F7; color: var(--ink);
    border-radius: 9px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: #EFEBE4; }
  .btn.primary { background: #1D1D1F; color: #fff; border-color: #1D1D1F; }
  .btn.primary:hover { background: #333; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  main { position: relative; overflow: hidden; }
  #map { width: 100%; height: 100%; display: block; padding: 10px 14px 64px; }
  #map g.node { cursor: pointer; transition: opacity .25s; }
  #map g.node:hover path, #map g.node:hover polygon { filter: brightness(.96); stroke-width: 3.2; }
  #map g.node.current path, #map g.node.current polygon { stroke: var(--accent); stroke-width: 4.5; }
  #map g.edge { transition: opacity .25s; }
  body.open #map g.edge:not(.out) { opacity: .22; }
  body.open #map g.edge.out path { stroke-width: 3.2; }
  body.open #map g.node:not(.current):not(.target) { opacity: .55; }
  #map #ORT { cursor: default; }

  .legend { position: absolute; left: 18px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 6px 18px;
    background: rgba(255,255,255,.88); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px;
    font-size: 13px; color: var(--muted); max-width: calc(100% - 36px); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .sw { width: 26px; height: 0; border-top: 3px solid; display: inline-block; }

  /* ---------- schwebendes Terminal ---------- */
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(30, 28, 25, .22); padding: 3vh 3vw; z-index: 10; }
  body.open .overlay { display: flex; }
  .win { width: min(1020px, 94vw); max-height: 94vh; display: flex; flex-direction: column; border-radius: 12px;
    overflow: hidden; background: #1E1E1E; box-shadow: 0 30px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06);
    animation: pop .28s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes pop { from { transform: translateY(14px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #2B2B2B; color: #BDBDBD;
    font-size: 14px; user-select: none; }
  .dots { display: flex; gap: 7px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .bar .ttl { font-family: var(--mono); }
  .chip { margin-left: 6px; font-size: 12px; padding: 2px 9px; border-radius: 999px; color: #1D1D1F; font-weight: 600; }
  .bar .x { margin-left: auto; background: transparent; border: 0; color: #BDBDBD; font-size: 22px; line-height: 1;
    cursor: pointer; padding: 0 4px; border-radius: 6px; }
  .bar .x:hover { color: #fff; background: #3A3A3A; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 14px 0; background: var(--term); }
  .tab { font: inherit; font-size: 13.5px; border: 1px solid #3A3A3A; background: #161616; color: #BDBDBD;
    border-radius: 7px; padding: 5px 12px; cursor: pointer; }
  .tab:hover { color: #fff; border-color: #555; }
  .tab.on { background: #E8E8E8; color: #111; border-color: #E8E8E8; font-weight: 600; }
  .tabs .hint { margin-left: auto; color: #777; font-size: 12px; align-self: center; }

  .term { margin: 0; padding: 18px 22px 22px; background: var(--term); color: var(--term-ink); overflow: auto;
    font-family: var(--mono); font-size: clamp(14px, 1.3vw, 20px); line-height: 1.42; white-space: pre; min-height: 9em; }
  .term .ln { opacity: 0; animation: ln .18s forwards; }
  @keyframes ln { to { opacity: 1; } }
  .term .in { color: var(--in); font-weight: 700; }
  .term .ok { color: var(--ok); }
  .term .cur { display: inline-block; width: .6em; height: 1.05em; vertical-align: -0.15em; background: var(--in);
    animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .foot { background: #FAF9F7; padding: 12px 16px 14px; color: var(--ink); border-top: 1px solid #2B2B2B; }
  .note { font-size: 14px; color: #4A4A4E; margin-bottom: 10px; }
  .next { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .next b { font-size: 13px; color: var(--muted); font-weight: 600; margin-right: 2px; }
  .go { font: inherit; font-size: 14px; border: 1px solid var(--line); background: #fff; border-radius: 9px;
    padding: 6px 12px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
  .go:hover { border-color: var(--accent); background: #F2F6FF; }
  .go kbd { font-family: var(--mono); font-size: 12.5px; background: #1D1D1F; color: #fff; padding: 2px 7px; border-radius: 5px; }
  .go .to { font-weight: 600; }

  @media (max-width: 760px) {
    header { flex-wrap: wrap; } header p { display: none; }
    .legend { font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .win, .term .ln { animation: none; opacity: 1; }
  }
</style>
</head>

(0x0).", "Press any key to close this window . . ."], "next": null}], "next": []}};
const ORDER = ["START","MENU","ORTE","WALD","HOEHLE","SCHLOSS","KAMPF","SIEG","BESIEGT","STADT","LADEN","INVENTAR","QUESTS","ENDE"];
const $ = id => document.getElementById(id);
let cur = null, vIdx = 0;

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function fmt(line) {
  return esc(line)
    .replace(/\{\{_\}\}/g, '<span class="cur"></span>')
    .replace(/\{\{(.*?)\}\}/g, '<span class="in">$1</span>')
    .replace(/\[\[(.*?)\]\]/g, '<span class="ok">$1</span>');
}

function render() {
  const s = SCREENS[cur], v = s.variants[vIdx];
  $("ttl").textContent = "RPGGame.exe — " + s.title.toUpperCase();
  $("chip").textContent = s.areaName; $("chip").style.background = s.fill;
  // Varianten-Reiter
  const tabs = $("tabs"); tabs.innerHTML = "";
  if (s.variants.length > 1) {
    s.variants.forEach((vv, i) => {
      const b = document.createElement("button");
      b.className = "tab" + (i === vIdx ? " on" : ""); b.textContent = vv.name;
      b.onclick = () => { vIdx = i; render(); };
      tabs.appendChild(b);
    });
    tabs.insertAdjacentHTML("beforeend", '<span class="hint">← → Variante wechseln</span>');
    tabs.style.display = "flex";
  } else tabs.style.display = "none";
  // Terminal-Zeilen nacheinander einblenden
  $("term").innerHTML = v.lines.map((l, i) =>
    `<div class="ln" style="animation-delay:${i * 28}ms">${fmt(l) || " "}</div>`).join("");
  $("term").scrollTop = 0;
  $("note").textContent = "💡 " + s.note;
  // Weiter-Schritte
  const steps = v.next || s.next, nx = $("next"); nx.innerHTML = "";
  if (steps.length) nx.insertAdjacentHTML("beforeend", "<b>Weiter:</b>");
  else nx.insertAdjacentHTML("beforeend", "<b>Ende des Programms.</b>");
  steps.forEach(([label, to]) => {
    const b = document.createElement("button"); b.className = "go";
    b.innerHTML = `<kbd>${esc(label)}</kbd><span>→</span><span class="to">${esc(SCREENS[to].title)}</span>`;
    b.onclick = () => openScreen(to);
    nx.appendChild(b);
  });
  highlight(cur, steps.map(s => s[1]));
}

function highlight(id, targets) {
  document.querySelectorAll("#map g.node").forEach(n => {
    n.classList.toggle("current", n.id === id);
    n.classList.toggle("target", targets.includes(n.id));
  });
  document.querySelectorAll("#map g.edge").forEach(e => {
    const t = e.querySelector("title")?.textContent || "";
    e.classList.toggle("out", t.startsWith(id + "->") || t.startsWith(id + "&#45;>"));
  });
}

function openScreen(id, variant = 0) {
  if (!SCREENS[id]) return;
  const same = cur === id;
  cur = id; vIdx = variant;
  document.body.classList.add("open");
  if (!same) { const w = $("win"); w.style.animation = "none"; w.offsetHeight; w.style.animation = ""; }
  render();
  try { history.replaceState(null, "", "#" + id.toLowerCase()); } catch (_) {}
  $("close").focus({ preventScroll: true });
}
function closeScreen() {
  document.body.classList.remove("open"); cur = null;
  document.querySelectorAll("#map g.node, #map g.edge").forEach(n => n.classList.remove("current", "target", "out"));
  try { history.replaceState(null, "", location.pathname + location.search); } catch (_) {}
}

// Klicks auf die Karte
document.querySelectorAll("#map g.node").forEach(n => {
  if (!SCREENS[n.id]) return;
  n.setAttribute("tabindex", "0"); n.setAttribute("role", "button");
  n.setAttribute("aria-label", SCREENS[n.id].title);
  n.addEventListener("click", () => openScreen(n.id));
  n.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openScreen(n.id); } });
});
$("close").onclick = closeScreen;
$("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeScreen(); });
$("tour").onclick = () => openScreen("START");

document.addEventListener("keydown", e => {
  if (!cur) return;
  const s = SCREENS[cur];
  if (e.key === "Escape") closeScreen();
  else if (e.key === "ArrowRight" && s.variants.length > 1) { vIdx = (vIdx + 1) % s.variants.length; render(); }
  else if (e.key === "ArrowLeft" && s.variants.length > 1) { vIdx = (vIdx - 1 + s.variants.length) % s.variants.length; render(); }
  else if (e.key === "ArrowDown" || e.key === "PageDown") { e.preventDefault(); openScreen(ORDER[(ORDER.indexOf(cur) + 1) % ORDER.length]); }
  else if (e.key === "ArrowUp" || e.key === "PageUp") { e.preventDefault(); openScreen(ORDER[(ORDER.indexOf(cur) - 1 + ORDER.length) % ORDER.length]); }
});

function fromHash() {
  const id = (location.hash || "").slice(1).toUpperCase();
  if (SCREENS[id]) openScreen(id); else if (cur) closeScreen();
}
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
